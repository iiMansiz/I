<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk Baru</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Tambah Produk Baru</h1>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="#">Produk</a></li>
                <li><a href="#">Pesanan</a></li>
                <li><a href="#">Promosi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Informasi Produk</h2>
            <form id="add-product-form">
                <div>
                    <label for="shop_id">ID Toko:</label>
                    <input type="number" id="shop_id" name="shop_id" required>
                </div>
                <div>
                    <label for="category_id">ID Kategori:</label>
                    <input type="number" id="category_id" name="category_id" required>
                </div>
                <div>
                    <label for="product_name">Nama Produk:</label>
                    <input type="text" id="product_name" name="product_name" required>
                </div>
                <div>
                    <label for="product_description">Deskripsi:</label>
                    <textarea id="product_description" name="product_description"></textarea>
                </div>
                <div>
                    <label for="price">Harga:</label>
                    <input type="number" id="price" name="price" step="0.01" required>
                </div>
                <div>
                    <label for="stock">Stok:</label>
                    <input type="number" id="stock" name="stock" required>
                </div>
                <div>
                    <label for="product_images">Gambar (JSON Array):</label>
                    <input type="text" id="product_images" name="product_images" placeholder='["/path/to/image1.jpg", "/path/to/image2.jpg"]'>
                </div>
                <button type="submit">Tambah Produk</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Panel Penjual</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const addProductForm = document.getElementById('add-product-form');

            addProductForm.addEventListener('submit', function(event) {
                event.preventDefault();

                const formData = new FormData(this);
                const productData = {};
                formData.forEach((value, key) => {
                    productData[key] = value;
                });

                // Coba parse product_images sebagai JSON
                try {
                    productData.product_images = JSON.parse(productData.product_images);
                } catch (e) {
                    if (productData.product_images) {
                        alert('Format gambar tidak valid (harus berupa array JSON).');
                        return;
                    } else {
                        productData.product_images = [];
                    }
                }

                fetch('http://localhost:5000/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(productData),
                })
                .then(response => response.json())
                .then(data => {
                    if (response.ok) {
                        alert('Produk berhasil ditambahkan!');
                        addProductForm.reset();
                    } else {
                        alert(`Gagal menambahkan produk: ${data.message || 'Terjadi kesalahan'}`);
                    }
                })
                .catch(error => {
                    console.error('Error adding product:', error);
                    alert('Terjadi kesalahan saat menambahkan produk.');
                });
            });
        });
    </script>
</body>
</html>
